[package]
name = "hubbypdf"
version = "0.1.4"
edition = "2024"

[dependencies]
pdfium-render = { version = "0.8.37", default-features = false, features = ["pdfium_7543", "image_025"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Foundation_Numerics"] }

[dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_Memory"] }




